id: minispil
lines:
  - id: faldskaerm
    speaker: sergent
    text: Faldskærm!
  - id: faldskaerm_hjaelp
    speaker: fortaeller
    text: Træk fingeren til siden og styr faldskærmssoldaten ned på målet.
  - id: korkskud
    speaker: sergent
    text: Korkskud!
  - id: korkskud_hjaelp
    speaker: fortaeller
    text: Tryk på skiverne, så hurtigt du kan – før de forsvinder igen.
  - id: stormloeb
    speaker: sergent
    text: Stormløb!
  - id: stormloeb_hjaelp
    speaker: fortaeller
    text: Tryk og tryk og tryk! Jo hurtigere du trykker, jo længere løber soldaten.
  - id: spiller_groen
    speaker: groen
    text: Den grønne hær kæmper nu.
  - id: spiller_sand
    speaker: sand
    text: Den sandfarvede hær kæmper nu.
  - id: spiller_blaa
    speaker: blaa
    text: Den gråblå hær kæmper nu.
  - id: spiller_brun
    speaker: brun
    text: Den brune hær kæmper nu.
  - id: klar
    speaker: sergent
    text: Klar …
  - id: parat
    speaker: sergent
    text: parat …
  - id: start
    speaker: sergent
    text: start!
  - id: faerdig
    speaker: sergent
    text: Færdig!
  - id: venter
    speaker: fortaeller
    text: Modstanderen kæmper stadig …
  - id: hop
    speaker: sergent
    text: Hop!
